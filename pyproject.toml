[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finpipe"
version = "0.1.0"
description = "Small, extensible financial/economic data ingestion framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "gspread>=6.0",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finpipe = "finpipe.cli:main"

[tool.setuptools.packages.find]
include = ["finpipe*"]
